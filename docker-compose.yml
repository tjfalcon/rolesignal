services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rolesignal
      POSTGRES_USER: rolesignal
      POSTGRES_PASSWORD: rolesignal-local
    ports:
      - "5432:5432"
    volumes:
      - rolesignal-postgres:/var/lib/postgresql/data

volumes:
  rolesignal-postgres:
