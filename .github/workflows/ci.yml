name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  api-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy api
      - run: pytest --cov=api --cov-report=term-missing

  postgres-retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rolesignal
          POSTGRES_USER: rolesignal
          POSTGRES_PASSWORD: rolesignal-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolesignal -d rolesignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rolesignal:rolesignal-ci@localhost:5432/rolesignal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m scripts.seed_evidence
      - run: pytest -q tests/test_postgres_integration.py
